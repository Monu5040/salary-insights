[project]
name = "salary-insights"
version = "0.1.0"
description = "Salary management for ACME's HR team"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "psycopg[binary,pool]>=3.2",
    "dj-database-url>=2.3",
    "gunicorn>=23",
    "whitenoise>=6.9",
    "tzdata>=2025.2",
    "django-stubs-ext>=5.2,<5.3",
    "faker>=37",
    "django-csp>=4.0",
    "drf-spectacular-sidecar>=2026.10.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.10",
    "pytest-cov>=6.1",
    "ruff>=0.11",
    "mypy>=1.15",
    "django-stubs[compatible-mypy]>=5.2,<5.3",
    "djangorestframework-stubs[compatible-mypy]>=3.16",
    "import-linter>=2.3",
    "hypothesis>=6.130",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "RUF", "S"]
# Django model Meta and admin options are class-level lists by design.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
"config/settings/{dev,test}.py" = ["S105"]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
# A fresh test database each run: tests that commit for real flush it when they finish, so a
# reused database would start the next run empty. Pass --reuse-db yourself for quick reruns.
addopts = "--strict-markers"

[tool.coverage.run]
source = ["apps", "config", "domain"]
omit = ["*/migrations/*", "config/settings/dev.py", "config/settings/prod.py", "config/wsgi.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.importlinter]
root_packages = ["apps", "config", "domain"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is pure Python: no Django, no apps"
type = "forbidden"
source_modules = ["domain"]
forbidden_modules = ["django", "rest_framework", "apps", "config"]
