# Local development: PostgreSQL only. The app runs on your machine for fast reloads (`make dev`).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acme
      POSTGRES_DB: acme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme -d acme"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
